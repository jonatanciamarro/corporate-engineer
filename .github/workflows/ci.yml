name: Corporate Pre-Flight CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pre-flight-gate:
    name: Pre-Flight Quality & Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          pip install -e .

      - name: 1. Linter Audit (Ruff)
        run: |
          ruff check src tests

      - name: 2. Strict Typecheck (Mypy)
        run: |
          mypy src

      - name: 3. Secret Audit Scan
        run: |
          python .agents/skills/corp-pipeline/scripts/secret_scanner.py .

      - name: 4. Automated Tests & Regressions (Pytest)
        run: |
          pytest tests/ -v
