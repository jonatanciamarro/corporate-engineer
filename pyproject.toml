[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corporate-engineer"
version = "0.1.0"
description = "Autonomous Corporate Software Engineer - Open Source Enterprise Agent Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.90.0",
    "pytest-cov>=5.0.0",
]
test = [
    "pytest>=8.0.0",
    "hypothesis>=6.90.0",
    "pytest-cov>=5.0.0",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
    "hypothesis>=6.90.0",
    "pytest-cov>=5.0.0",
]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.90.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
corporate-engineer = "corporate_engineer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".agents"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
exclude = [".agents"]
ignore_missing_imports = true

